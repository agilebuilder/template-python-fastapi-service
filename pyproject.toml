<% var pkg = packageDir.charAt(0) === '<' ? snakeCase(projectName) : packageDir -%>
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "<%= projectName %>"
version = "0.1.0"
description = "<%= description %>"
readme = "README.md"
requires-python = ">=<%= pythonVersion %>"
<% if (author) { -%>
authors = [{ name = "<%= author %>" }]
<% } -%>
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[project.scripts]
<%= pkg %> = "<%= pkg %>.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/<%= pkg %>"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py<%= String(pythonVersion).replace('.', '') %>"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["<%= pkg %>"]
