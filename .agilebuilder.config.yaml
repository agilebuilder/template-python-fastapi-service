version: "1.0"
name: fastapi-service
description: FastAPI + SQLAlchemy 2.x + Pydantic v2 async API service template with src layout and pyproject.toml packaging
variables:
  enabled: true
  delimiter: "%"
  filePatterns:
    mode: include
    patterns:
      - "pyproject.toml"
      - "README.md"
      - "README.zh-CN.md"
      - "AGENTS.md"
      - ".env.example"
      - "src/**/*.py"
      - "tests/**/*.py"
  inquirerQuestions:
    - name: projectName
      type: input
      message: Project name
      default: demo-api
      required: true
    - name: packageDir
      type: input
      message: Python package directory name (defaults to snake_case of project name)
      default: "<%= snakeCase(projectName) %>"
    - name: description
      type: input
      message: Project description
      default: A FastAPI service
    - name: author
      type: input
      message: Author
      default: ""
    - name: port
      type: number
      message: Server port
      default: 8000
    - name: pythonVersion
      type: list
      message: Python version
      choices:
        - "3.11"
        - "3.12"
      default: "3.12"
hooks:
  after_write:
    scriptType: shell
    script: 'git init && git add -A && git commit -m "chore: init project from template"'
    errorHandling: warn
market:
  slug: fastapi-service
  name: FastAPI async service
  summary: Async API starter with FastAPI, SQLAlchemy 2.x and Pydantic v2.
  description: |
    An async API service template built on FastAPI, SQLAlchemy 2.x (asyncio) and Pydantic v2.

    - src layout with modern pyproject.toml (hatchling) packaging
    - Standard layering: api routes / services business logic / models / schemas
    - Centralized configuration via pydantic-settings with .env overrides
    - Built-in health check endpoint and item CRUD example (SQLite + aiosqlite, runnable out of the box)
    - pytest + pytest-asyncio + httpx AsyncClient async test examples
    - Ruff for linting and formatting
    - Configurable project name, package directory, server port and Python version (3.11/3.12)
  category: Backend services
  tags:
    - Python
    - FastAPI
    - SQLAlchemy
    - Pydantic
    - Async
  version: 1.0.0
  gitUrl: https://github.com/agilebuilder/template-python-fastapi-service.git
  defaultBranch: main
  metadata-zh:
    name: FastAPI 异步服务
    summary: FastAPI + SQLAlchemy 2.x + Pydantic v2 的异步 API 服务模板，分层清晰、开箱可跑
    description: |
      基于 FastAPI、SQLAlchemy 2.x（asyncio）与 Pydantic v2 的异步 API 服务工程模板。

      - src 布局 + pyproject.toml（hatchling）现代打包方式
      - 标准分层：api 路由 / services 业务逻辑 / models 数据模型 / schemas 校验模型
      - pydantic-settings 集中管理配置，支持 .env 环境变量覆盖
      - 内置健康检查端点与 Item CRUD 示例（SQLite + aiosqlite，开箱即跑）
      - pytest + pytest-asyncio + httpx AsyncClient 异步测试示例
      - Ruff 一体化 lint / 格式化配置
      - 支持自定义项目名、包目录名、服务端口与 Python 版本（3.11/3.12）
    category: 后端服务
    tags:
      - Python
      - FastAPI
      - SQLAlchemy
      - Pydantic
      - 异步
